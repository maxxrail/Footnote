repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"] # the eval seed corpus fixture (filings.json.gz) is ~830 KB
      - id: check-merge-conflict
      # Blocks committing a private key. CI runs gitleaks on every commit.
      - id: detect-private-key
