services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: analyst
    ports:
      # Host port 5433 by default so it doesn't clash with another Postgres on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
