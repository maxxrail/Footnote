[project]
name = "analyst-agent"
version = "0.4.0"
description = "AI financial analyst over SEC filings, with every number cited."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=1",
    "httpx>=0.27",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.4",
    "reportlab>=5.1.1",
    "sqlalchemy>=2.0.30",
]

[project.optional-dependencies]
dev = [
    "formulas>=1.3.4",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.9",
    "types-pyyaml>=6.0.12.20261122",
]
ml = [
    "sentence-transformers>=6.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["analyst/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# SEC filings and model answers use typographic quotes, dashes, minus and multiplication
# signs; the parser and the number post-check match them on purpose.
allowed-confusables = ["’", "–", "—", "“", "”", "−", "×"]

[tool.mypy]
python_version = "3.12"
files = ["analyst", "tests", "scripts"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits SEC EDGAR or a real LLM (skipped by default; run with -m live)"]
