name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    # Nothing to check until Part 1 adds pyproject.toml.
    if: ${{ hashFiles('pyproject.toml') != '' }}

    # Same image as docker-compose, so CI tests what developers run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst
          POSTGRES_DB: analyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://analyst:analyst@localhost:5432/analyst
      SEC_USER_AGENT: analyst-agent-ci ci@example.com

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Migrations apply to a fresh database
        run: uv run alembic upgrade head

      - name: Models and migrations agree
        run: uv run alembic check

      - name: pytest (no network, no LLM; live tests are skipped)
        run: uv run pytest -rs

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not just the last

      - name: Install uv
        if: ${{ hashFiles('uv.lock') != '' }}
        uses: astral-sh/setup-uv@v7

      - name: pip-audit (known vulnerabilities in locked dependencies)
        if: ${{ hashFiles('uv.lock') != '' }}
        run: |
          uv export --format requirements-txt --no-emit-project --extra dev > /tmp/req.txt
          uvx pip-audit@2.9.0 -r /tmp/req.txt --disable-pip --progress-spinner off

      - name: gitleaks (secrets in any commit)
        # Reviewed false positives are listed in .gitleaksignore.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Part 6 adds the Dockerfile.
    if: ${{ hashFiles('Dockerfile') != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t analyst-agent:ci .

      - name: Container answers /health
        run: |
          docker run -d --name aa -p 8000:8000 analyst-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy"; docker rm -f aa; exit 0
            fi
            sleep 1
          done
          echo "service never became healthy"; docker logs aa; docker rm -f aa; exit 1
