name: Evals

# The real-model eval suite. It calls the model, so it costs money (capped by --budget),
# and it runs only when started by hand (Actions > Evals > Run workflow). Every PR is
# gated for free instead by the replayed smoke eval in ci.yml.
# Needs the ANTHROPIC_API_KEY secret (Settings > Secrets and variables > Actions).
# It runs on the committed seed corpus (AAPL, MSFT, NVDA, JPM); items about other
# companies are skipped and listed in the summary.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Agent model (blank: the configured default)"
        required: false
      dataset:
        description: "Dataset to run"
        default: "all"
      budget:
        description: "Hard cap in USD"
        default: "3.00"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to post the score table

jobs:
  has-runner:
    # hashFiles() isn't allowed in a job-level `if:`, so this job checks for the file
    # and the real job reads its output.
    name: Check for analyst/evals/run.py
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f "analyst/evals/run.py" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; fi

  evals:
    name: Eval suite (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Part 5 adds the runner.
    needs: has-runner
    if: needs.has-runner.outputs.present == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst
          POSTGRES_DB: analyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analyst"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://analyst:analyst@localhost:5432/analyst
      SEC_USER_AGENT: analyst-agent-ci ci@example.com
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: The API key secret is configured
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Load the eval corpus (cached SEC fixtures, no live SEC calls)
        run: |
          uv run alembic upgrade head
          uv run python -m analyst.evals.seed

      - name: Run the eval suite
        id: suite
        env:
          MODEL: ${{ inputs.model }}
          DATASET: ${{ inputs.dataset || 'all' }}
          BUDGET: ${{ inputs.budget || '3.00' }}
        run: |
          args=(--dataset "$DATASET" --gate --markdown eval-summary.md
                --out eval-results.json --budget "$BUDGET")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          set +e
          uv run python -m analyst.evals.run "${args[@]}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Score table in the job summary
        if: always()
        run: '[ -f eval-summary.md ] && cat eval-summary.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Post the score table on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('eval-summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- eval-suite -->"
          { echo "$marker"; cat eval-summary.md; } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Keep the results file
        if: always() && hashFiles('eval-results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval-results.json

      - name: Fail if the suite is below its thresholds
        run: exit "${{ steps.suite.outputs.exit }}"
