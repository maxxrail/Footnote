# Weekly update PRs; each runs the full CI, including the security job.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The project targets Python 3.12. Moving to a new Python is a deliberate change.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
